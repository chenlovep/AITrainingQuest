name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed v1.2 source
        if: hashFiles('AITrainingQuest-Android-v1.2-reviewed.zip') != ''
        run: |
          echo '27913e41ed39856c68aca4671f89e27a2b8a7292b0aeee13c21ec3ca192953ee  AITrainingQuest-Android-v1.2-reviewed.zip' | sha256sum -c -
          unzip -o AITrainingQuest-Android-v1.2-reviewed.zip -x '.github/*'
          git rm AITrainingQuest-Android-v1.2-reviewed.zip
          git add .gitignore README.md app build.gradle.kts settings.gradle.kts gradle.properties
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import complete reviewed Android v1.2 source'
          git push origin HEAD:main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk AITrainingQuest-v1.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AITrainingQuest-v1.2-APK
          path: AITrainingQuest-v1.2-debug.apk
          if-no-files-found: error
          retention-days: 30
